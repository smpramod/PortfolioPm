<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="440" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820"/>
      <stop offset="1" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="cyan" x1="120" y1="120" x2="400" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75FFE9"/>
      <stop offset=".5" stop-color="#37E5D0"/>
      <stop offset="1" stop-color="#13AFA8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Portfolio / favicon background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5"
        stroke="#26333A" stroke-width="1"/>

  <!-- Subtle orbital ring -->
  <ellipse cx="256" cy="256" rx="184" ry="82" transform="rotate(-28 256 256)"
           stroke="#1B716E" stroke-width="3" opacity=".55"/>
  <ellipse cx="256" cy="256" rx="150" ry="64" transform="rotate(28 256 256)"
           stroke="#1B716E" stroke-width="2" opacity=".35"/>

  <!-- Monogram: A -->
  <path d="M125 364L206 148H248L327 364H286L267 309H185L166 364H125ZM197 274H255L226 187L197 274Z"
        fill="url(#cyan)" filter="url(#glow)"/>

  <!-- Monogram: F -->
  <path d="M286 148H389V184H326V237H379V273H326V364H286V148Z"
        fill="#EAF8F5"/>

  <!-- Tech node -->
  <circle cx="389" cy="184" r="9" fill="#75FFE9"/>
  <circle cx="389" cy="184" r="18" stroke="#37E5D0" stroke-opacity=".3" stroke-width="2"/>

  <!-- Tiny circuit accents -->
  <path d="M102 398H150M362 398H410M95 115H142M370 115H417"
        stroke="#2BCFC1" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <circle cx="95" cy="398" r="5" fill="#37E5D0"/>
  <circle cx="417" cy="115" r="5" fill="#37E5D0"/>
</svg>